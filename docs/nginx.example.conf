# 宝塔站点配置（可整段替换站点「配置文件」）
# 适用：反代本机 Web 控制台 http://127.0.0.1:8787/
# 访问：http://8.148.235.33/
#
# 程序 config.yaml 需为：
#   web_host: 127.0.0.1
#   web_port: 8787
#   web_password: '你的密码'

server
{
    listen 80;
    server_name 8.148.235.33;

    # 宝塔扩展 / 证书申请（保留）
    include /www/server/panel/vhost/nginx/extension/8.148.235.33/*.conf;
    include /www/server/panel/vhost/nginx/well-known/8.148.235.33.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    # 证书验证目录
    location ^~ /.well-known/ {
        root /www/wwwroot/8.148.235.33;
        allow all;
    }

    # 全部反代到控制台（含 /static/*.css *.js，不要再写本地 js/css 规则）
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（实时日志）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        proxy_buffering off;
    }

    access_log  /www/wwwlogs/8.148.235.33.log;
    error_log   /www/wwwlogs/8.148.235.33.error.log;
}
