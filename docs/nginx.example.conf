# B站自动回复控制台 - Nginx 反代示例（适配宝塔 / 普通 Nginx）
#
# 【宝塔面板推荐】
#   1. 面板里添加站点（域名或服务器公网 IP）
#   2. 站点 → 设置 → 配置文件，用「下面 server { } 里的内容」替换/合并
#   3. 不要把本文件整段粘贴进 /www/server/nginx/conf/nginx.conf 开头
#   4. 程序 config.yaml：
#        web_host: 127.0.0.1
#        web_port: 8787
#        web_password: '强密码'
#   5. 安全组只放行 80/443，不要对公网开放 8787
#
# 说明：下面直接 proxy_pass 到 127.0.0.1:8787，不使用 upstream，
# 避免贴错位置触发：upstream directive is not allowed here

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;   # 改成域名，或服务器公网 IP

    # 可选：只允许你自己的电脑公网 IP
    # allow 39.185.200.203;
    # deny all;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 实时日志 WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}

# ---------- 若已开 SSL（宝塔点「部署证书」后一般会自动生成 443 server）----------
# 在对应的 443 server 里同样加上面那段 location / { ... } 即可，例如：
